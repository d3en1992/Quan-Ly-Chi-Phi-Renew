<title>Giao diện QLCP mới</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0..1,0&display=swap">
<style>
/* Bố cục: thanh xem mẫu → khung app (máy tính: menu trái + nội dung + bảng trượt / điện thoại: khung 390px + thanh dưới) → cột ghi chú thay đổi */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#EDF1F5; --line:#DCE2E9; --line-soft:#E9EDF2;
  --fg:#16202A; --muted:#5B6877; --faint:#8995A3;
  --accent:#1D5DB5; --accent-soft:#E2EBF8; --accent-fg:#FFFFFF;
  --good:#17804A; --good-soft:#E1F3E8; --bad:#C2372C; --bad-soft:#FBE6E4; --warn:#A86A12; --warn-soft:#FBF0DC;
  --shadow:0 1px 2px rgba(22,32,42,.06),0 8px 24px rgba(22,32,42,.08);
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#151D25; --surface-2:#1B252F; --line:#283441; --line-soft:#212C37;
  --fg:#E5EAF0; --muted:#97A4B2; --faint:#6F7C8A;
  --accent:#6FA3F0; --accent-soft:#1A2A40; --accent-fg:#0E141A;
  --good:#4FC283; --good-soft:#15301F; --bad:#F2786C; --bad-soft:#3A1C1A; --warn:#E2AA4E; --warn-soft:#352812;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#151D25; --surface-2:#1B252F; --line:#283441; --line-soft:#212C37;
  --fg:#E5EAF0; --muted:#97A4B2; --faint:#6F7C8A;
  --accent:#6FA3F0; --accent-soft:#1A2A40; --accent-fg:#0E141A;
  --good:#4FC283; --good-soft:#15301F; --bad:#F2786C; --bad-soft:#3A1C1A; --warn:#E2AA4E; --warn-soft:#352812;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;font-size:20px;line-height:1;display:inline-block;vertical-align:middle;letter-spacing:normal;text-transform:none;white-space:nowrap;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;width:1em;overflow:hidden;flex:none}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.r{text-align:right} .c{text-align:center}
.dim{color:var(--faint)} .pos{color:var(--good)} .neg{color:var(--bad)}

/* Thanh xem mẫu */
.mockbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.mockbar h1{font-size:15px;font-weight:700;margin:0}
.mockbar .sub{color:var(--muted);font-size:12.5px}
.mockbar .grow{flex:1 1 auto}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:6px;font-size:13px;font-weight:500;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:34px;display:inline-grid;place-items:center;color:var(--muted)}
.stagewrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:1100px){.stagewrap{grid-template-columns:minmax(0,1fr)}}
.stage{min-width:0}

/* Ghi chú */
.notes{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;align-self:start;position:sticky;top:12px}
.notes h2{font-size:13px;margin:0 0 4px;font-weight:700}
.notes p.hint{margin:0 0 12px;color:var(--muted);font-size:12.5px}
.notes h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin:14px 0 6px;font-weight:600}
.notes ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.notes li{display:grid;grid-template-columns:auto 1fr;gap:8px;font-size:13px;align-items:start}
.code{font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.code.doi{background:var(--accent-soft);color:var(--accent)}
.code.giu{background:var(--surface-2);color:var(--muted)}
.code.moi{background:var(--good-soft);color:var(--good)}
.code.bo{background:var(--bad-soft);color:var(--bad)}

/* Khung máy tính */
.dwrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line);box-shadow:var(--shadow);background:var(--bg)}
.desk{min-width:1180px;display:grid;grid-template-columns:236px minmax(0,1fr);min-height:780px;position:relative;overflow:hidden}
.side{background:var(--surface);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.brand .logo{width:32px;height:32px;border-radius:8px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center}
.brand b{font-size:14px;display:block;line-height:1.2}
.brand small{color:var(--faint);font-size:11.5px}
.navgrp{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);padding:12px 10px 4px;font-weight:600}
.nav{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;border:0;background:transparent;text-align:left;width:100%;color:var(--muted);font-size:13.5px;font-weight:500}
.nav .ms{font-size:19px}
.nav:hover{background:var(--surface-2);color:var(--fg)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .tag{margin-left:auto;font-size:10px;font-weight:700;background:var(--good-soft);color:var(--good);padding:1px 6px;border-radius:99px}
.side .spacer{flex:1}
/* Máy tính bảng / Z Fold mở: menu thu thành cột biểu tượng */
.dwrap.tabw{max-width:880px;margin:0 auto}
.desk.tab{min-width:0;width:860px;grid-template-columns:64px minmax(0,1fr)}
.desk.tab .side{padding:12px 8px;align-items:center}
.desk.tab .brand div:last-child,.desk.tab .navgrp{display:none}
.desk.tab .nav{font-size:0;justify-content:center;padding:9px 0;width:44px}
.desk.tab .nav .ms{font-size:21px}
.desk.tab .nav .tag{display:none}
.desk.tab .top{padding:10px 16px}
.desk.tab .search kbd,.desk.tab .sync{display:none}
.desk.tab .page{padding:18px 16px 32px}
.desk.tab .two,.desk.tab .twoeq,.desk.tab .split,.desk.tab .ocr{grid-template-columns:minmax(0,1fr)}
.desk.tab .ctgrid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.rocard{display:flex;gap:8px;align-items:center;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:600}
.lvl{display:inline-flex;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:6px;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--faint)}
.lvl.view{background:var(--surface-2);color:var(--muted);border-color:transparent}
.lvl.add{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.lvl.full{background:var(--good-soft);color:var(--good);border-color:transparent}
.perm td{text-align:center} .perm td:first-child{text-align:left}
.capt{display:grid;place-items:center;aspect-ratio:3/4;max-height:300px;background:#10161C;border-radius:12px;color:#c9d3dd;text-align:center;font-size:12.5px;padding:16px;position:relative}
.capt .ms{font-size:44px;color:#c9d3dd;margin:0 auto 6px;display:block}
.capt .frame{position:absolute;inset:14% 10%;border:2px solid rgba(255,255,255,.7);border-radius:10px}
.main{display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:10px 24px;border-bottom:1px solid var(--line);background:var(--surface)}
.search{flex:0 1 380px;display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:8px;padding:7px 10px;color:var(--faint);font-size:13px}
.search kbd{margin-left:auto;font:inherit;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--surface)}
.top .grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;background:var(--surface);white-space:nowrap}
.avatar{width:28px;height:28px;border-radius:99px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:11px}
.sync{display:inline-flex;align-items:center;gap:6px;color:var(--good);font-size:12.5px}
.sync i{width:7px;height:7px;border-radius:99px;background:var(--good);display:inline-block}

.page{padding:22px 24px 40px;display:flex;flex-direction:column;gap:16px;min-width:0}
.ph{display:flex;align-items:flex-end;gap:12px 16px;flex-wrap:wrap}
.ph h2{font-size:21px;font-weight:700;margin:0;letter-spacing:-.015em}
.ph p{margin:2px 0 0;color:var(--muted);font-size:13px}
.ph .grow{flex:1}
.crumb{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:4px;margin-bottom:4px}
.crumb button{border:0;background:none;color:var(--accent);padding:0;font-size:12.5px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn .ms{font-size:18px}
.btn.danger{color:var(--bad)}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.subtabs button{border:0;background:transparent;padding:8px 12px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;letter-spacing:.02em}
.subtabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.f{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--fg);white-space:nowrap}
.f small{color:var(--faint)}
.f .ms{font-size:17px;color:var(--faint)}
.f.q{min-width:240px;color:var(--faint)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:12px 16px}
.kpi small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.kpi b{display:block;font-size:19px;font-weight:700;letter-spacing:-.01em;margin-top:2px}
.kpi span{font-size:12px;color:var(--faint)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card > header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.card > header h3{margin:0;font-size:14px;font-weight:700}
.card > header .grow{flex:1}
.card > header small{color:var(--muted)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11.5px;font-weight:600;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tbody tr:hover td{background:var(--surface-2)}
tbody tr.click{cursor:pointer}
tfoot td{font-weight:700;border-top:1px solid var(--line);border-bottom:0;background:var(--surface-2)}
th.grp{text-align:center;border-bottom:1px solid var(--line-soft);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint)}
td.ctn,th.ctn{min-width:300px}
td.nd{max-width:320px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.g{background:var(--good-soft);color:var(--good)} .pill.b{background:var(--bad-soft);color:var(--bad)}
.pill.w{background:var(--warn-soft);color:var(--warn)} .pill.a{background:var(--accent-soft);color:var(--accent)} .pill.n{background:var(--surface-2);color:var(--muted)}
.role{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-size:11px;font-weight:700;background:var(--surface-2);color:var(--muted)}
.role.C{background:var(--accent-soft);color:var(--accent)} .role.T{background:var(--good-soft);color:var(--good)} .role.P{background:var(--warn-soft);color:var(--warn)}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.g i{background:var(--good)} .bar.w i{background:var(--warn)} .bar.b i{background:var(--bad)}
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.twoeq{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.split{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px;align-items:start}
.hb{display:grid;grid-template-columns:minmax(110px,auto) 1fr auto;gap:8px 10px;align-items:center;font-size:12.5px;padding:14px 16px}
.hb .bar{height:8px}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px;padding:16px}
.formgrid .full{grid-column:1/-1}
.formgrid .span2{grid-column:span 2}
.fl{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0;align-content:start}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 10px;font-size:13px;color:var(--fg);height:36px;display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0}
.inp .tx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--fg);font-weight:500;white-space:nowrap}
.chk .ms{font-size:20px;color:var(--accent)} .chk.off .ms{color:var(--faint)}
.newsup{border:1px dashed var(--accent);background:var(--accent-soft);border-radius:8px;padding:10px 12px;display:grid;gap:8px;grid-column:1/-1}
.addr{font-size:12px;color:var(--muted);display:flex;gap:4px;align-items:center}
.addr .ms{font-size:15px;color:var(--faint)}
.inp.ro{background:var(--surface-2);color:var(--muted)}
.inp .ms{font-size:17px;color:var(--faint)}
.formact{display:flex;gap:8px;justify-content:flex-end;padding:0 16px 16px}
.chart{padding:12px 16px 16px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--faint);font-size:10px;font-family:var(--font)}
.note{display:flex;gap:8px;align-items:flex-start;background:var(--accent-soft);color:var(--fg);border-radius:8px;padding:10px 12px;font-size:12.5px}
.note .ms{color:var(--accent);font-size:18px}

/* Công trình */
.section-h{display:flex;align-items:baseline;gap:8px;margin:4px 0 -4px}
.section-h h3{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.section-h span{color:var(--faint);font-size:12px}
.ctgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ct{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left}
.ct:hover{border-color:var(--accent)}
.ct .t{display:flex;gap:8px;align-items:flex-start}
.ct .t b{font-size:14px;line-height:1.35;flex:1}
.ct .meta{color:var(--muted);font-size:12.5px;display:flex;gap:12px;flex-wrap:wrap}
.ct .meta span{display:flex;gap:4px;align-items:center}
.ct .meta .ms{font-size:15px;color:var(--faint)}
.ct dl{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0;padding-top:10px;border-top:1px solid var(--line-soft)}
.ct dt{font-size:11px;color:var(--faint)}
.ct dd{margin:0;font-weight:600;font-size:13px}
.ct .thu{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.ct .thu .bar{flex:1}

/* Lưới nhập */
.gridin td{padding:0;border-right:1px solid var(--line-soft)}
.gridin td:last-child{border-right:0}
.gridin .cell{display:block;padding:9px 12px;min-height:38px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gridin td.act{outline:2px solid var(--accent);outline-offset:-2px;background:var(--accent-soft);position:relative;overflow:visible}
.gridin .rn{width:36px;text-align:center;color:var(--faint);font-size:12px;padding:9px 0}
.ac{position:absolute;left:-2px;top:100%;z-index:3;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);min-width:230px;padding:4px;font-size:13px}
.ac div{padding:6px 10px;border-radius:5px}
.ac div.on{background:var(--accent-soft);color:var(--accent)}
.ac small{display:block;padding:4px 10px;color:var(--faint);font-size:11px}
.keys{display:flex;flex-wrap:wrap;gap:12px;color:var(--muted);font-size:12px;padding:10px 16px;border-top:1px solid var(--line-soft);align-items:center}
.keys kbd{font:inherit;font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface);color:var(--fg);margin-right:4px}
.auto{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:5px 10px}
.auto b{color:var(--fg)}

/* Chụp hóa đơn */
.ocr{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
.photo{background:repeating-linear-gradient(-45deg,var(--surface-2),var(--surface-2) 8px,var(--surface) 8px,var(--surface) 16px);border:1px dashed var(--line);border-radius:var(--r);aspect-ratio:3/4;max-width:100%;display:grid;place-items:center;color:var(--muted);text-align:center;font-size:12.5px;padding:16px}
.photo .ms{font-size:40px;display:block;margin:0 auto 8px;color:var(--faint)}
.lowc{background:var(--warn-soft)!important}
.lowc .cell,.lowc{position:relative}
.steps{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
.steps span{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.steps span.on{background:var(--accent);color:var(--accent-fg)}
.steps span.ok{background:var(--good-soft);color:var(--good)}

/* Chấm công */
.week{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.week button{border:0;background:transparent;padding:6px 8px;color:var(--muted)}
.week b{font-size:13px;padding:0 6px;white-space:nowrap}
.d{width:44px;text-align:center}
.dv{display:inline-block;min-width:28px;padding:2px 0;border-radius:5px;font-weight:600}
.dv.full{background:var(--good-soft);color:var(--good)} .dv.half{background:var(--warn-soft);color:var(--warn)} .dv.off{color:var(--faint);font-weight:400}

/* Chi tiết dòng mở rộng */

function renderPhone(){
  let [t,s,body] = MP[S.mpage](); const mk=(MORE.find(m=>m[0]===S.mpage)||[])[3]; if(mk&&!canSee(mk)) body=blocked();
  const items=[['home','home','Tổng quan'],['ct','construction','Công trình'],['nhap','add_card','Nhập'],['cc','calendar_month','Chấm công'],['more','apps','Thêm']];
  const navKey = S.mpage==='ctdetail'?'ct':['home','ct','nhap','cc'].includes(S.mpage)?S.mpage:['chup','cccd','chupmenu'].includes(S.mpage)?'nhap':'more';
  const main5=['home','ct','nhap','cc','more']; const backTo = S.mpage==='ctdetail'?'ct':['chup','cccd'].includes(S.mpage)?'chupmenu':S.mpage==='chupmenu'?'home':'more'; const back = !main5.includes(S.mpage) ? `<button class="iconbtn" data-mpage="${backTo}" aria-label="Quay lại"><span class="ms">arrow_back</span></button>` : '';
  return `<div class="phonewrap"><div class="phone ${innerWidth<520?'bare':''}"><div class="pstatus"><span>9:41</span><span>5G ▮▮▮</span></div>
   <div class="phead">${back}<div style="flex:1;min-width:0"><h2>${t}</h2><small>${s}</small></div><button class="iconbtn" aria-label="Tìm"><span class="ms">search</span></button></div>
   <div class="pbody">${body}</div>
   ${!['nhap','chup','cccd','chupmenu'].includes(S.mpage)&&!me().ro?`<button class="fab" data-mpage="chupmenu" aria-label="Chụp hóa đơn, CCCD"><span class="ms">photo_camera</span>Chụp</button>`:''}
   <nav class="pnav">${items.map(([k,ic,l])=>`<button data-mpage="${k}" ${navKey===k?'aria-current="page"':''}><span class="ms">${ic}</span>${l}</button>`).join('')}</nav></div></div>`;
}

/* ======================= GHI CHÚ + ĐIỀU KHIỂN ======================= */
function renderNotes(){
  const li = arr => `<ul>${arr.map(([k,c,t])=>`<li><span class="code ${k}">${c}</span><span>${t}</span></li>`).join('')}</ul>`;
  const label = S.view!=='phone' ? (S.page==='chitietct'?'Chi tiết công trình':(NAV.flatMap(g=>g.items).find(i=>i[0]===S.page)||[0,0,'Thùng Rác'])[2]) : 'Điện thoại';
  const pn = S.view==='phone' ? PHONE_NOTES : (S.view==='tab'?TAB_NOTES:[]).concat(PAGE_NOTES[S.page]||[]);
  return `<h2>Thay đổi so với app cũ</h2><p class="hint">Trả lời kiểu “bỏ Đ4”, “Đ12 ok”. <b>G</b> = giữ nguyên, <b>B</b> = bỏ tính năng.</p>
   <h3>Màn này · ${label}</h3>${li(pn)}<h3>Toàn app</h3>${li(GLOBAL_NOTES)}`;
}
function render(){
  document.getElementById('stage').innerHTML = S.view==='phone' ? renderPhone() : renderDesk();
  document.getElementById('notes').innerHTML = renderNotes();
  document.getElementById('v-desk').setAttribute('aria-pressed', S.view==='desk');
  document.getElementById('v-tab').setAttribute('aria-pressed', S.view==='tab');
  document.getElementById('v-phone').setAttribute('aria-pressed', S.view==='phone');
  document.getElementById('rolesel').innerHTML = Object.entries(ACCOUNTS).map(([k,a])=>`<button data-role="${k}" aria-pressed="${S.role===k}">${a.vai}</button>`).join('');
}
document.getElementById('v-desk').onclick=()=>{S.view='desk';S.drawer=null;render();};
document.getElementById('v-tab').onclick=()=>{S.view='tab';S.drawer=null;render();};
document.getElementById('v-phone').onclick=()=>{S.view='phone';render();};
document.getElementById('rolesel').addEventListener('click',e=>{const b=e.target.closest('[data-role]');if(!b)return;S.role=b.dataset.role;render();});
document.getElementById('theme').onclick=()=>{const r=document.documentElement;const dark=r.getAttribute('data-theme')==='dark'||(!r.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches);r.setAttribute('data-theme',dark?'light':'dark');};
document.getElementById('stage').addEventListener('click',e=>{
  const t=e.target.closest('[data-page],[data-sub],[data-mpage],[data-drawer],[data-close],[data-toggle],[data-ctg],[data-ct],[data-mct],[data-dm]'); if(!t) return;
  if(t.dataset.dm){S.dm=t.dataset.dm;}
  else if(t.dataset.page){S.page=t.dataset.page;S.sub=0;S.drawer=null;}
  else if(t.dataset.sub){S.sub=+t.dataset.sub;S.drawer=null;}
  else if(t.dataset.mpage){S.mpage=t.dataset.mpage;}
  else if(t.dataset.mct){S.ctId=+t.dataset.mct;S.mpage='ctdetail';}
  else if(t.dataset.drawer){S.drawer=t.dataset.drawer;}
  else if(t.hasAttribute('data-close')){S.drawer=null;}
  else if(t.dataset.toggle){S.open[t.dataset.toggle]=!S.open[t.dataset.toggle];}
  else if(t.dataset.ctg){S.ctGroup=t.dataset.ctg;}
  else if(t.dataset.ct){S.ctId=+t.dataset.ct;S.page='chitietct';S.sub=0;S.drawer=null;}
  render();
  if(t.dataset.page||t.dataset.ct) document.querySelector('.page')?.scrollIntoView({block:'nearest'});
});
render();
