<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <!-- Mobile-first: viewport chuẩn để app hiển thị vừa khít màn hình điện thoại -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quản Lý Chi Phí Công Trình</title>

  <!-- Bootstrap 5 (CDN) — ưu tiên dùng class Bootstrap, hạn chế CSS thủ công -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Google Fonts: IBM Plex Sans (UI chính) + IBM Plex Mono (số tiền, bảng) -->
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <!-- Bootstrap Icons 1.11.3 — bộ icon vector dùng cho sidebar và các nút -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />

  <!-- CSS tùy chỉnh app — nạp SAU Bootstrap để có thể ghi đè -->
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <!-- Toàn bộ giao diện do js/app.js dựng vào đây: màn hình đăng nhập + màn hình app. -->
  <div id="app-root"></div>

  <!-- Bootstrap 5 JS bundle — cần cho Offcanvas sidebar (☰ menu trượt) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Điểm khởi động DUY NHẤT của ứng dụng (ráp khung, đăng nhập, điều hướng tab). -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
